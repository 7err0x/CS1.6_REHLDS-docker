; Permanent Steam/Valve ID bans (engine loads this at map start).                                                        
; Host path: ./data/cs16-state/banned.cfg — bind-mounted into the container.                                             
; After live bans: rcon writeid  (or edit this file and rcon exec banned.cfg).                                           
;                                                                                                                        
; Format: banid <minutes> STEAM_X:Y:Z                                                                                    
;   minutes 0 = permanent (written as 0.0)                                                                               
;   Y must be 0 or 1 (STEAM_0:4:… is invalid and will not match)                                                         
; With ReUnion, ban both STEAM_0 and STEAM_1 for the same account number when unsure.                                    

                                                                                                                 
