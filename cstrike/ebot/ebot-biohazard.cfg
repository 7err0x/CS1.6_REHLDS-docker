// E-BOT overrides for Biohazard (cs16-biohazard image).
// Base defaults ship in addons/ebot/ebot.cfg from E-BOT 1.10 release.
// E-BOT also reads bh_starttime from Biohazard AMXX; ebot_zp_delay_custom should match it.
// Upstream: https://github.com/EfeDursun125/CS-EBOT

// Total E-BOT players (0–32). bio_ebot_schedule.amxx overrides this when bh_ebot_sched_enable 1.
ebot_quota "0"

// Reserve this many player slots for humans (ebot_quota + humans + keep_slots ≤ maxplayers).
ebot_keep_slots "2"

// Seconds after round start before bots attack enemies (pre-infection grace).
// Set to match bh_starttime in bh_cvars.cfg (default 15.0).
ebot_zp_delay_custom "15.0"

// If no waypoints exist, auto-run the map analyzer (like CS/CZ nav generation).
ebot_analyze_auto_start "1"

// Bot name pool: edit cstrike/ebot/names.cfg (one name per line), then rebuild image.
// Bot name prefix: 0 = none, 1 = [E-BOT], 2 = [E-BOT] + skill in name.
ebot_name_tag "1"

// Show plausible ping values for bots in scoreboard (0 = real/zero ping).
ebot_fake_ping "0"

// Human bots use flares in dark areas when enemies may be nearby (pairs with customflashlight).
ebot_use_flares "1"

// Zombies count as path cost during human pathfinding (humans route away from zombies).
ebot_zombie_count_as_path_cost "1"

// Humans use full pathfinding to flee zombies (smarter, more CPU than simple avoid).
ebot_use_pathfinding_for_avoid "1"

// Max breakable health bots will try to destroy (lasermines, glass, etc.); higher = more targets.
ebot_breakable_health_limit "5000.0"
