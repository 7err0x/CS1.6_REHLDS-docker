// E-BOT overrides for waypoint/matrix baking (ebot-waypoints-bake compose service).
// Do not use on production cs16-biohazard.

ebot_quota "1"
ebot_keep_slots "0"
ebot_analyze_auto_start "1"
ebot_disable_path_matrix "0"
ebot_stop_bots "0"
ebot_zp_delay_custom "0"

// Faster auto-analyze (coarser grid — fine for bake; hand-edit later if needed).
ebot_analyze_grid_distance "128"

// Short rounds / map time so bake advances quickly (overrides server-biohazard.cfg).
mp_timelimit "5"
mp_roundtime "2"
mp_freezetime "0"
mp_buytime "0"
