; AMX Mod X admins — https://wiki.alliedmods.net/Adding_Admins_(AMX_Mod_X)
; Host path: cstrike/amxmodx/users.ini (bind-mounted → addons/amxmodx/configs/users.ini).
; After edits: rcon amx_reloadadmins
;
; Format (quote each field):
;   "auth" "password" "access flags" "account flags" "name" "contact"
;
; Access flags (common): abcdefghijklmnopqrstu = full admin; l = menu only.
; Do not use access flag "z" for admins.
;
; Account flags (auth style — field 4):
;   c = auth is a SteamID / WONID (use with ReUnion STEAM_X:Y:Z from "status")
;   d = auth is an IP
;   e = password is NOT checked (SteamID/IP alone is enough) — recommended default
;   a = disconnect / kick if password is missing or wrong
;       → client MUST set:  setinfo _pw "same-password-as-field-2"
;       → kick message: "You have no entry to the server..." (AMXX NO_ENTRY)
;   b = auth is a clan tag / name prefix
;
; Password field (setinfo):
;   Server cvar amx_password_field defaults to "_pw" (see amxx.cfg).
;   In the CS 1.6 client console (or cstrike/userconfig.cfg / autoexec.cfg):
;     setinfo _pw "YourPasswordHere"
;   Persist it so it survives reconnects. Without this, account flag "a" kicks you
;   even when your SteamID is correct and you are not in banned.cfg.
;
; Recommended — SteamID, no password (no setinfo needed):
;   "STEAM_0:0:12345678" "" "abcdefghijklmnopqrstu" "ce" "" ""
;
; SteamID + password (requires setinfo _pw on the client):
;   "STEAM_0:0:12345678" "MySecret" "abcdefghijklmnopqrstu" "ac" "" ""
;   Client: setinfo _pw "MySecret"
;
; IP admin, no password:
;   "127.0.0.1" "" "abcdefghijklmnopqrstu" "de" "" ""
;
; ReUnion note: use the exact ID from "status" / server logs (e.g. STEAM_0:4:…).
; Middle digit is not limited to 0/1 when ReUnion assigns the authid.

