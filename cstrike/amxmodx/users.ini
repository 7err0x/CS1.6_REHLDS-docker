; AMX Mod X admins — https://wiki.alliedmods.net/Adding_Admins_(AMX_Mod_X)
; Format: "auth" "password" "access flags" "account flags" "name" "contact"
; Common flags: l = default menu; abcdefghijklmnopqrstu = full admin (typical 1.8.x)
;
; Examples (uncomment and set your values):
; "STEAM_0:0:12345678" "" "abcdefghijklmnopqrstu" "ce" "" ""
; "127.0.0.1" "" "l" "de" "" ""
