// Respawn deathmatch preset (ReGameDLL). Loaded on boot and every map via server.cfg + respawn_defaults.amxx.
// Rebuild cs16 image after edits: docker compose build cs16 && docker compose --profile respawn up -d --force-recreate

mp_forcerespawn 1
mp_round_infinite 0
mp_buytime -1
mp_maxrounds 0
mp_winlimit 0
mp_fraglimit 0

mp_randomspawn 1
mp_roundtime 10

mp_freeforall 1
mp_friendlyfire 0
mp_autoteambalance 1
mp_freezetime 0

mp_infinite_ammo 2
mp_respawn_immunitytime 3
mp_respawn_immunity_effects 1
mp_respawn_immunity_force_unset 1

mp_timelimit 30
mp_flashlight 0

bh_enabled 0
bh_lights ""

echo "[config/respawn-dm.cfg] Respawn DM preset loaded."
