// First boot only: respawn mapcycle and preset. Per-map rules live in config/server.cfg (respawn image).

mapcyclefile mapcycle.txt
mp_forcerespawn 1
mp_flashlight 0

// Biohazard must not run on this profile (plugins-respawn.ini). Clear stale cvars from old shared config.cfg.
bh_enabled 0
bh_lights ""

echo "[config/gamemode-respawn.cfg] Respawn deathmatch preset loaded."
