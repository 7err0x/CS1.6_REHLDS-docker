// Optional HTTP FastDL: clients fetch maps / models / sounds over HTTP instead of the game link.
// Your web tree must mirror paths under cstrike/ (e.g. maps/foo.bsp, models/..., sound/...).
// Trailing slash on the URL is required.
//
// 1. Uncomment sv_downloadurl and set your public base URL (LAN IP or hostname + FASTDL_HTTP_PORT).
// 2. The FastDL container builds .bz2 sidecars at startup (see README — Security & performance).
//
// sv_downloadurl "http://192.168.1.10:8080/"

// Keep slow SV_SendResources path enabled as fallback if HTTP misses a file (default is often 1).
sv_allowdownload 1
