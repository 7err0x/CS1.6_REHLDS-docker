// Optional HTTP FastDL: clients fetch maps / models / sounds over HTTP instead of the game link.
// Your web tree must mirror paths under cstrike/ (e.g. maps/foo.bsp, models/..., sound/...).
// Trailing slash on the URL is required.
//
// 1. Uncomment the next line and set your public base URL.
// 2. Set sv_downloadurl below (trailing slash). The compose fastdl profile serves files + auto .bz2 sidecars.
// 3. Rebuild/restart fastdl after adding maps under data/cs16-game-assets/ (see README FastDL).
//
// sv_downloadurl "https://your-cdn.example.com/cs16-fastdl/"
// LAN + compose FastDL profile (default port 8080): http://192.168.x.x:8080/

// Keep slow SV_SendResources path enabled as fallback if HTTP misses a file (default is often 1).
sv_allowdownload 1
sv_downloadurl "http://10.168.68.107:8080/"