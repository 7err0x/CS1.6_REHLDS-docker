// Loaded on every map via cstrike/server.cfg (mounted in docker-compose.yml).
// ReGameDLL (installed in Dockerfile hlds-base stage) provides deathmatch-style respawn.

// --- VAC / compatibility (Steam + non-Steam via ReUnion in the image) ---
// default.cfg sets secure 1 (VAC). Turn VAC off for mixed clients and stable Docker joins.
// ReUnion handles non-Steam auth; liblist.gam also sets secure "0".
secure 0
// Avoid hard consistency checks that can fault with mixed client/server assets on custom maps.
mp_consistency 0

// --- Server tick / frame rate (250 Hz) ---
sys_ticrate 250
fps_max 250

// --- Map rotation (respawn; bio profile uses mapcycle.biohazard.txt via gamemode-biohazard.cfg) ---
mapcyclefile mapcycle.txt

// --- Respawn / deathmatch (ReGameDLL) ---
// Players respawn after death instead of waiting for the round to end.
mp_forcerespawn 1

// Spawn protection after respawn (ReGameDLL). 0 = off; >0 = seconds of damage immunity.
mp_respawn_immunitytime 3
mp_respawn_immunity_effects 1
// End protection on move/attack: 0 = never auto-clear, 1 = move or shoot, 2 = shoot only.
mp_respawn_immunity_force_unset 1

// ReGameDLL ammo: 0 = normal, 1 = infinite clip (no reload), 2 = infinite reserve (reload forever).
mp_infinite_ammo 2

// 0 = normal teams (CT vs T) with respawn. Set to 1 for free-for-all (no teams).
mp_freeforall 0

// --- Comfort / pacing (tweak as you like) ---
mp_friendlyfire 0
mp_autoteambalance 1
mp_roundtime 3
mp_freezetime 2
mp_buytime 0.25
mp_timelimit 30

// --- Voice ---
sv_alltalk 1

// Crosshair name (bio_crosshair_id.amxx): team-colored name under sights; disables ReGameDLL spotted hints.
mp_playerid 2
bh_crosshair_id 1
bh_crosshair_id_dist 4096

// AMXX stock plugins: force English (stock lang files lack [ro]; avoids ML_NOTFOUND with multilingual off)
amx_language en

// --- Optional: join password (uncomment and set) ---
// sv_password "your_join_password"

// HTTP FastDL for custom maps / assets (edit config/fastdl.cfg — see README).
exec config/fastdl.cfg

echo "[config/server.cfg] Respawn (ReGameDLL) settings loaded."
