// Loaded on every map via cstrike/server.cfg (baked into the cs16-respawn image).
// ReGameDLL (installed in Dockerfile hlds-base stage) provides deathmatch-style respawn.

// --- Security (engine defaults: sv_allow_autoaim 1, sv_allowupload 1 — see map-start cvar dump) ---
sv_allow_autoaim 0   // block client auto-aim (old WON/legacy clients)
sv_allowupload 0     // block custom spray/logo uploads to the server
sv_aim 0             // disable server-side aim assist for projectile weapons

// --- VAC / compatibility (Steam + non-Steam via ReUnion in the image) ---
secure 0
mp_consistency 0

// --- Server tick / frame rate (250 Hz) ---
sys_ticrate 250
fps_max 250

// --- Map rotation ---
mapcyclefile mapcycle.txt

// --- Respawn deathmatch preset (see config/respawn-dm.cfg) ---
// respawn_defaults.amxx re-applies this after map load; use rcon amx_respawn_apply to force.
exec config/respawn-dm.cfg

// --- Voice ---
sv_alltalk 1

// Crosshair name (bio_crosshair_id.amxx)
mp_playerid 2
bh_crosshair_id 1
bh_crosshair_id_dist 4096

amx_language en

exec config/fastdl.cfg

echo "[config/server.cfg] Respawn profile loaded."
