// Same role as server.cfg for the main container, but for Biohazard / infection (no ReGameDLL per-death respawn).
// The cs16-biohazard service mounts this file over config/server.cfg.

// --- VAC / compatibility ---
secure 0
mp_consistency 0

// --- Server tick / frame rate (75 Hz) ---
sys_ticrate 250
fps_max 250

// --- Rounds (infection mods control flow per round) ---
mp_forcerespawn 0
mp_freeforall 0

// --- Comfort / pacing ---
mp_friendlyfire 0
mp_autoteambalance 1
mp_roundtime 7
mp_freezetime 3
mp_buytime 20
mp_timelimit 40
mp_flashlight 1

// Zombie class SPEED in bh_zombieclass.ini can exceed 320; biohazard.sma raises this on map load.
sv_maxspeed 300

// --- Voice ---
sv_alltalk 1

// ReGameDLL player ID: 2 = off (no lower-left name / "spotted" hints). Names under crosshair: bio_crosshair_id.amxx.
mp_playerid 2

mapcyclefile mapcycle.biohazard.txt

// --- Optional: join password (uncomment and set) ---
// sv_password "your_join_password"

// HTTP FastDL (strongly recommended for ZM maps + Biohazard models/sounds) — config/fastdl.cfg.
exec config/fastdl.cfg

// E-BOT (Metamod) — zombie/biohazard AI; loaded via plugins.ini on biohazard image only.
exec addons/ebot/ebot-biohazard.cfg

// LaserTripmine (AMXX scroll): periodic chat reminder for humans (see README — Lasermines).
amx_scrollmsg "Type /help | Lasermines: buy — say /lm | place: use V | remove yours: USE (E) — README" 660

echo "[config/server-biohazard.cfg] Infection / Biohazard-oriented server.cfg loaded."

sv_allowupload 0
sv_allow_autoaim 0

# defaults are 400 and 2500
sv_rehlds_movecmdrate_max_avg 800                                                                                                               
sv_rehlds_movecmdrate_max_burst 8000 
