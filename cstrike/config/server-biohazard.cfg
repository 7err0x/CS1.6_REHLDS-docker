// Same role as server.cfg for the main container, but for Biohazard / infection (no ReGameDLL per-death respawn).
// The cs16-biohazard service mounts this file over config/server.cfg.

// --- VAC / compatibility ---
secure 0
mp_consistency 0

// --- Rounds (infection mods control flow per round) ---
mp_forcerespawn 0
mp_freeforall 0

// --- Comfort / pacing ---
mp_friendlyfire 0
mp_autoteambalance 1
mp_roundtime 7
mp_freezetime 3
mp_buytime 20
mp_timelimit 20
mp_flashlight 1

// --- Voice ---
sv_alltalk 1

mapcyclefile mapcycle.biohazard.txt

// --- Optional: join password (uncomment and set) ---
// sv_password "your_join_password"

// HTTP FastDL (strongly recommended for ZM maps + Biohazard models/sounds) — config/fastdl.cfg.
exec config/fastdl.cfg

// LaserTripmine (AMXX scroll): periodic chat reminder for humans (see README — Lasermines).
amx_scrollmsg "Lasermines (humans): buy — say /lm or bind buy_lasermine | place: bind KEY +setlaser | remove yours: USE (E) or bind KEY +dellaser while aiming — README" 660

echo "[config/server-biohazard.cfg] Infection / Biohazard-oriented server.cfg loaded."
