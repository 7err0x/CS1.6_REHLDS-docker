// HLDS auto-runs this on map load when +servercfgfile points here (ebot-waypoints-bake).
// Minimal bake stack: infection plugins stay loaded, but timing + E-BOT tuned for waypoint generation.
exec config/fastdl.cfg
exec config/gamemode-biohazard.cfg
exec addons/ebot/ebot-waypoints-bake.cfg

mp_consistency 0
mp_forcerespawn 0
mp_friendlyfire 0
sv_allowupload 0
sv_allow_autoaim 0

// Re-apply after any plugin cfg (E-BOT execs addons/ebot/ebot.cfg on load).
ebot_analyze_grid_distance "40"
ebot_analyze_auto_start "1"
ebot_quota "4"
ebot_keep_slots "0"
ebot_stop_bots "0"
ebot_zp_delay_custom "0"
mp_timelimit "58"
mp_roundtime "2"
mp_freezetime "0"
mp_buytime "0"

echo "[config/server-ebot-bake.cfg] E-BOT waypoint/matrix bake mode."
