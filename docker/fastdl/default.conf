# Static FastDL for GoldSrc / CS 1.6 — document root = cstrike-like tree (maps/, models/, sound/, …).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    charset off;
    default_type application/octet-stream;

    # Raw file bytes; no gzip (clients use .bz2 sidecars when present).
    gzip off;

    location / {
        try_files $uri =404;
    }
}
