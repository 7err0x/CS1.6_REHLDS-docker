# Static FastDL for GoldSrc / CS 1.6 — document root = cstrike-like tree (maps/, models/, sound/, …).
# Clients request file.ext.bz2 when a sidecar exists (generated by compress-bz2.sh at build/start).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    charset off;
    default_type application/octet-stream;

    # Pre-compressed .bz2 sidecars only — do not gzip on the fly.
    gzip off;

    location / {
        try_files $uri =404;
    }
}
