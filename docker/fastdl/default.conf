# Static FastDL for GoldSrc / CS 1.6 — document root = cstrike-like tree (maps/, models/, sound/, …).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    charset off;
    default_type application/octet-stream;

    # Raw file bytes; no gzip. GoldSrc prefers parallel .bz2 URLs (e.g. maps/foo.bsp.bz2).
    # The FastDL entrypoint runs bzip2-assets.sh to create those sidecars at container start.
    gzip off;

    location / {
        try_files $uri =404;
    }
}
