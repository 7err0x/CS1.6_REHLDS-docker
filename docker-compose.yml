# Base image entrypoint ends with +map de_dust2; that map reloads after Metamod/AMXX init and overrides +map in command.
# Drop the baked +map so the last +map in `command` wins (see blsalin/rehlds-cstrike image).
x-hlds-entrypoint: &hlds_entrypoint
  - "./hlds_run"
  - "-timeout 3"
  - "-pingboost 1"
  - "-game cstrike"

services:
  cs16:
    entrypoint: *hlds_entrypoint
    profiles:
      - respawn
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HLDS_BASE_IMAGE: ${HLDS_BASE_IMAGE:-ghcr.io/blsalin/rehlds-cstrike:edge}
        AMXX_BASE_URL: ${AMXX_BASE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-base-linux.tar.gz}
        AMXX_CSTRIKE_URL: ${AMXX_CSTRIKE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-cstrike-linux.tar.gz}
        LASERMINE_GIT_SHA: ${LASERMINE_GIT_SHA:-7e7a285254ba699a1fcfbb43a7378bfc63acb309}
    image: ${CS16_IMAGE_NAME:-cs16-respawn:latest}
    container_name: cs16-respawn0
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "${SERVER_PORT:-27016}:27015/tcp"
      - "${SERVER_PORT:-27016}:27015/udp"
    volumes:
      # Merged into the image cstrike tree; server.cfg chain loads config/server.cfg last.
      - ./cstrike/config:/opt/steam/hlds/cstrike/config:ro
      # AMXX admins (edit on host; see README). Matches image default baked at build time.
      - ./cstrike/amxmodx/users.ini:/opt/steam/hlds/cstrike/addons/amxmodx/configs/users.ini:ro
      # Optional: custom ReUnion rules (cid_* / AuthVersion). Copy defaults from the image first.
      # - ./cstrike/reunion.cfg:/opt/steam/hlds/cstrike/reunion.cfg:ro
      # If a map needs a missing texture WAD, copy it from your Steam cstrike folder and uncomment:
      # - ./cstrike/de_vegas.wad:/opt/steam/hlds/cstrike/de_vegas.wad:ro
    # Appended after the image ENTRYPOINT (hlds_run ... +map de_dust2). Last +map wins.
    command:
      - "+maxplayers"
      - "${MAX_PLAYERS:-16}"
      - "+rcon_password"
      - "${RCON_PASSWORD:-changeme}"
      - "+hostname"
      - "${SERVER_HOSTNAME:-CS16-Respawn-Docker}"
      - "+log"
      - "on"
      - "+map"
      - "${START_MAP:-fy_iceworld}"

  # Biohazard / old-school infection (dark zm_/zb_ maps + dedicated plugins.ini). Not started by default.
  # Run: docker compose --profile biohazard up -d
  # Add biohazard.amxx to image/zombiemod/extra-plugins/ then docker compose build (see README).
  cs16-biohazard:
    entrypoint: *hlds_entrypoint
    profiles:
      - biohazard
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HLDS_BASE_IMAGE: ${HLDS_BASE_IMAGE:-ghcr.io/blsalin/rehlds-cstrike:edge}
        AMXX_BASE_URL: ${AMXX_BASE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-base-linux.tar.gz}
        AMXX_CSTRIKE_URL: ${AMXX_CSTRIKE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-cstrike-linux.tar.gz}
        LASERMINE_GIT_SHA: ${LASERMINE_GIT_SHA:-7e7a285254ba699a1fcfbb43a7378bfc63acb309}
    image: ${CS16_IMAGE_NAME:-cs16-respawn:latest}
    container_name: cs16-biohazard0
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "${BIOHAZARD_SERVER_PORT:-27017}:27015/tcp"
      - "${BIOHAZARD_SERVER_PORT:-27017}:27015/udp"
    volumes:
      - ./cstrike/reunion.cfg:/opt/steam/hlds/cstrike/reunion.cfg:ro
      - ./cstrike/config:/opt/steam/hlds/cstrike/config:ro
      # Round-based infection tuning + mapcycle (replaces default respawn server.cfg for this container only).
      - ./cstrike/config/server-biohazard.cfg:/opt/steam/hlds/cstrike/config/server.cfg:ro
      - ./cstrike/amxmodx/users.ini:/opt/steam/hlds/cstrike/addons/amxmodx/configs/users.ini:ro
      - ./image/zombiemod/plugins-biohazard.ini:/opt/steam/hlds/cstrike/addons/amxmodx/configs/plugins.ini:ro
    command:
      - "+exec"
      - "config/gamemode-biohazard.cfg"
      - "+maxplayers"
      - "${MAX_PLAYERS:-16}"
      - "+rcon_password"
      - "${BIOHAZARD_RCON_PASSWORD:-changeme}"
      - "+hostname"
      - "${BIOHAZARD_SERVER_HOSTNAME:-CS16-Biohazard}"
      - "+log"
      - "on"
      - "+map"
      - "${BIOHAZARD_START_MAP:-cs_estate}"

  # HTTP FastDL: nginx image built from GAME_IMAGE — copies maps/models/sound/… baked into cs16 image.
  # Build game first, then fastdl: docker compose build cs16 fastdl
  # Run: docker compose --profile fastdl up -d  (port FASTDL_HTTP_PORT, default 8080)
  fastdl:
    profiles:
      - fastdl
    build:
      context: .
      dockerfile: docker/fastdl/Dockerfile
      args:
        GAME_IMAGE: ${CS16_IMAGE_NAME:-cs16-respawn:latest}
    image: ${FASTDL_IMAGE_NAME:-cs16-fastdl:latest}
    container_name: cs16-fastdl0
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "${FASTDL_HTTP_PORT:-8080}:80/tcp"
