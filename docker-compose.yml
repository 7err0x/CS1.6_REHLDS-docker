# HLDS merges ./data/cs16-game-assets at start (`cs16-merge-game-assets-entrypoint.sh`).
x-cs16-merge-entrypoint: &cs16_merge_entrypoint
  - "/usr/local/sbin/cs16-merge-game-assets-entrypoint.sh"

x-cs16-hardening: &cs16_hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Required with cap_drop: root cannot write steam-owned volume roots without DAC_OVERRIDE.
  cap_add:
    - DAC_OVERRIDE
    - CHOWN
    - FOWNER
    # Drop from root entrypoint to steam after setup (no setuid with no-new-privileges).
    - SETUID
    - SETGID
  read_only: true
  tmpfs:
    - /tmp:size=64M,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-cs16-respawn-cmd: &cs16_respawn_cmd
  - "./hlds_run"
  - "-timeout 3"
  - "-pingboost 2"
  - "-game"
  - "cstrike"
  - "+maxplayers"
  - "${MAX_PLAYERS:-16}"
  - "+rcon_password"
  - "${RCON_PASSWORD:-changeme}"
  - "+hostname"
  - "${SERVER_HOSTNAME:-CS16-Respawn-Docker}"
  - "+log"
  - "on"
  - "+map"
  - "${START_MAP:-fy_iceworld}"

x-cs16-biohazard-cmd: &cs16_biohazard_cmd
  - "./hlds_run"
  - "-timeout 3"
  - "-pingboost 2"
  - "-game"
  - "cstrike"
  - "+exec"
  - "config/gamemode-biohazard.cfg"
  - "+maxplayers"
  - "${MAX_PLAYERS:-16}"
  - "+rcon_password"
  - "${BIOHAZARD_RCON_PASSWORD:-changeme}"
  - "+hostname"
  - "${BIOHAZARD_SERVER_HOSTNAME:-CS16-Biohazard}"
  - "+log"
  - "on"
  - "+map"
  - "${BIOHAZARD_START_MAP:-cs_estate}"

services:
  download-game-assets:
    build:
      context: .
      dockerfile: docker/game-assets/Dockerfile
    image: ${CS16_DOWNLOAD_ASSETS_IMAGE:-cs16-download-game-assets:latest}
    profiles:
      - download-assets
    volumes:
      - ./data/cs16-game-assets:/out

  cs16:
    <<: *cs16_hardening
    entrypoint: *cs16_merge_entrypoint
    profiles:
      - respawn
    build:
      context: .
      dockerfile: Dockerfile
      target: cs16
      args:
        REHLDS_BUILD: ${REHLDS_BUILD:-3.13.0.788}
        METAMOD_VERSION: ${METAMOD_VERSION:-1.3.0.138}
        REGAMEDLL_VERSION: ${REGAMEDLL_VERSION:-5.26.0.668}
        REAPI_VERSION: ${REAPI_VERSION:-5.24.0.300}
        AMXX_BASE_URL: ${AMXX_BASE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-base-linux.tar.gz}
        AMXX_CSTRIKE_URL: ${AMXX_CSTRIKE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-cstrike-linux.tar.gz}
        LASERMINE_GIT_SHA: ${LASERMINE_GIT_SHA:-7e7a285254ba699a1fcfbb43a7378bfc63acb309}
        REUNION_VERSION: ${REUNION_VERSION:-0.2.0.25}
    image: ${CS16_IMAGE_NAME:-cs16-respawn:latest}
    container_name: cs16-respawn0
    restart: unless-stopped
    platform: linux/amd64
    working_dir: /opt/steam/hlds
    user: "0:0"
    ports:
      - "${SERVER_PORT:-27016}:27015/tcp"
      - "${SERVER_PORT:-27016}:27015/udp"
    volumes:
      - ./cstrike/config:/opt/steam/hlds/cstrike/config:ro
      - ./cstrike/amxmodx/users.ini:/mnt/cs16-overrides/amxmodx/users.ini:ro
      - ./data/cs16-game-assets:/mnt/cs16-game-assets:ro,z
      - ./data/cs16-logs:/opt/steam/hlds/cstrike/logs:z
      - ./data/cs16-state:/opt/steam/hlds/cstrike-writable:z
      - ./data/cs16-state/config.cfg:/opt/steam/hlds/cstrike/config.cfg:z
      - ./data/cs16-state/banned.cfg:/opt/steam/hlds/cstrike/banned.cfg:z
      - ./data/cs16-state/listip.cfg:/opt/steam/hlds/cstrike/listip.cfg:z
      - cs16_maps:/opt/steam/hlds/cstrike/maps
      - cs16_sound:/opt/steam/hlds/cstrike/sound
      - cs16_models:/opt/steam/hlds/cstrike/models
      - cs16_sprites:/opt/steam/hlds/cstrike/sprites
      - cs16_cstrike_runtime:/opt/steam/hlds/cstrike
      - cs16_amx_configs:/opt/steam/hlds/cstrike/addons/amxmodx/configs
    command: *cs16_respawn_cmd

  cs16-biohazard:
    <<: *cs16_hardening
    entrypoint: *cs16_merge_entrypoint
    profiles:
      - biohazard
    build:
      context: .
      dockerfile: Dockerfile
      target: cs16
      args:
        REHLDS_BUILD: ${REHLDS_BUILD:-3.13.0.788}
        METAMOD_VERSION: ${METAMOD_VERSION:-1.3.0.138}
        REGAMEDLL_VERSION: ${REGAMEDLL_VERSION:-5.26.0.668}
        REAPI_VERSION: ${REAPI_VERSION:-5.24.0.300}
        AMXX_BASE_URL: ${AMXX_BASE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-base-linux.tar.gz}
        AMXX_CSTRIKE_URL: ${AMXX_CSTRIKE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-cstrike-linux.tar.gz}
        LASERMINE_GIT_SHA: ${LASERMINE_GIT_SHA:-7e7a285254ba699a1fcfbb43a7378bfc63acb309}
        REUNION_VERSION: ${REUNION_VERSION:-0.2.0.25}
    image: ${CS16_IMAGE_NAME:-cs16-respawn:latest}
    container_name: cs16-biohazard0
    restart: unless-stopped
    platform: linux/amd64
    working_dir: /opt/steam/hlds
    user: "0:0"
    ports:
      - "${BIOHAZARD_SERVER_PORT:-27017}:27015/tcp"
      - "${BIOHAZARD_SERVER_PORT:-27017}:27015/udp"
    networks:
      - biohazard_isolated
    volumes:
      - ./cstrike/reunion.cfg:/opt/steam/hlds/cstrike/reunion.cfg:ro
      - ./cstrike/config:/opt/steam/hlds/cstrike/config:ro
      - ./cstrike/config/server-biohazard.cfg:/opt/steam/hlds/cstrike/config/server.cfg:ro
      - ./cstrike/amxmodx/users.ini:/mnt/cs16-overrides/amxmodx/users.ini:ro
      - ./image/zombiemod/plugins-biohazard.ini:/mnt/cs16-overrides/amxmodx/plugins.ini:ro
      - ./data/cs16-game-assets:/mnt/cs16-game-assets:ro,z
      - ./data/cs16-logs:/opt/steam/hlds/cstrike/logs:z
      - ./data/cs16-state:/opt/steam/hlds/cstrike-writable:z
      - ./data/cs16-state/config.cfg:/opt/steam/hlds/cstrike/config.cfg:z
      - ./data/cs16-state/banned.cfg:/opt/steam/hlds/cstrike/banned.cfg:z
      - ./data/cs16-state/listip.cfg:/opt/steam/hlds/cstrike/listip.cfg:z
      - cs16_maps:/opt/steam/hlds/cstrike/maps
      - cs16_sound:/opt/steam/hlds/cstrike/sound
      - cs16_models:/opt/steam/hlds/cstrike/models
      - cs16_sprites:/opt/steam/hlds/cstrike/sprites
      - cs16_cstrike_runtime:/opt/steam/hlds/cstrike
      - cs16_amx_configs:/opt/steam/hlds/cstrike/addons/amxmodx/configs
    command: *cs16_biohazard_cmd

  fastdl:
    init: true
    security_opt:
      - no-new-privileges:true
    profiles:
      - fastdl
    build:
      context: .
      dockerfile: docker/fastdl/Dockerfile
      args:
        GAME_IMAGE: ${CS16_IMAGE_NAME:-cs16-respawn:latest}
    image: ${FASTDL_IMAGE_NAME:-cs16-fastdl:latest}
    container_name: cs16-fastdl0
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "${FASTDL_HTTP_PORT:-8080}:80/tcp"
    volumes:
      - ./data/cs16-game-assets:/mnt/cs16-game-assets:ro
    environment:
      FASTDL_BZ2_MIN_KB: ${FASTDL_BZ2_MIN_KB:-256}

networks:
  # No default route to the internet — blocks outbound from the Biohazard container.
  # Published ports still accept incoming game traffic from the host.
  biohazard_isolated:
  #  internal: true

volumes:
  cs16_maps:
  cs16_sound:
  cs16_models:
  cs16_sprites:
  cs16_cstrike_runtime:
  cs16_amx_configs:
