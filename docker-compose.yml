# Base image entrypoint ends with +map de_dust2; that map reloads after Metamod/AMXX init and overrides +map in command.
# HLDS merges ./data/cs16-game-assets at start (`cs16-merge-game-assets-entrypoint.sh`).
x-cs16-merge-entrypoint: &cs16_merge_entrypoint
  - "/usr/local/sbin/cs16-merge-game-assets-entrypoint.sh"

x-cs16-respawn-cmd: &cs16_respawn_cmd
  - "./hlds_run"
  - "-timeout 3"
  - "-pingboost 1"
  - "-game cstrike"
  - "+maxplayers"
  - "${MAX_PLAYERS:-16}"
  - "+rcon_password"
  - "${RCON_PASSWORD:-changeme}"
  - "+hostname"
  - "${SERVER_HOSTNAME:-CS16-Respawn-Docker}"
  - "+log"
  - "on"
  - "+map"
  - "${START_MAP:-fy_iceworld}"

x-cs16-biohazard-cmd: &cs16_biohazard_cmd
  - "./hlds_run"
  - "-timeout 3"
  - "-pingboost 1"
  - "-game cstrike"
  - "+exec"
  - "config/gamemode-biohazard.cfg"
  - "+maxplayers"
  - "${MAX_PLAYERS:-16}"
  - "+rcon_password"
  - "${BIOHAZARD_RCON_PASSWORD:-changeme}"
  - "+hostname"
  - "${BIOHAZARD_SERVER_HOSTNAME:-CS16-Biohazard}"
  - "+log"
  - "on"
  - "+map"
  - "${BIOHAZARD_START_MAP:-cs_estate}"

services:
  download-game-assets:
    build:
      context: .
      dockerfile: docker/game-assets/Dockerfile
    image: ${CS16_DOWNLOAD_ASSETS_IMAGE:-cs16-download-game-assets:latest}
    profiles:
      - download-assets
    volumes:
      - ./data/cs16-game-assets:/out

  cs16:
    entrypoint: *cs16_merge_entrypoint
    profiles:
      - respawn
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HLDS_BASE_IMAGE: ${HLDS_BASE_IMAGE:-ghcr.io/blsalin/rehlds-cstrike:edge}
        AMXX_BASE_URL: ${AMXX_BASE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-base-linux.tar.gz}
        AMXX_CSTRIKE_URL: ${AMXX_CSTRIKE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-cstrike-linux.tar.gz}
        LASERMINE_GIT_SHA: ${LASERMINE_GIT_SHA:-7e7a285254ba699a1fcfbb43a7378bfc63acb309}
    image: ${CS16_IMAGE_NAME:-cs16-respawn:latest}
    container_name: cs16-respawn0
    restart: unless-stopped
    platform: linux/amd64
    working_dir: /opt/steam/hlds
    ports:
      - "${SERVER_PORT:-27016}:27015/tcp"
      - "${SERVER_PORT:-27016}:27015/udp"
    volumes:
      - ./data/cs16-game-assets:/mnt/cs16-game-assets:ro
      - ./cstrike/config:/opt/steam/hlds/cstrike/config:ro
      - ./cstrike/amxmodx/users.ini:/opt/steam/hlds/cstrike/addons/amxmodx/configs/users.ini:ro
    command: *cs16_respawn_cmd

  cs16-biohazard:
    entrypoint: *cs16_merge_entrypoint
    profiles:
      - biohazard
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HLDS_BASE_IMAGE: ${HLDS_BASE_IMAGE:-ghcr.io/blsalin/rehlds-cstrike:edge}
        AMXX_BASE_URL: ${AMXX_BASE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-base-linux.tar.gz}
        AMXX_CSTRIKE_URL: ${AMXX_CSTRIKE_URL:-https://github.com/alliedmodders/amxmodx/releases/download/1.9.0.5303/amxmodx-1.9.0-git5303-cstrike-linux.tar.gz}
        LASERMINE_GIT_SHA: ${LASERMINE_GIT_SHA:-7e7a285254ba699a1fcfbb43a7378bfc63acb309}
    image: ${CS16_IMAGE_NAME:-cs16-respawn:latest}
    container_name: cs16-biohazard0
    restart: unless-stopped
    platform: linux/amd64
    working_dir: /opt/steam/hlds
    ports:
      - "${BIOHAZARD_SERVER_PORT:-27017}:27015/tcp"
      - "${BIOHAZARD_SERVER_PORT:-27017}:27015/udp"
    volumes:
      - ./data/cs16-game-assets:/mnt/cs16-game-assets:ro
      - ./cstrike/reunion.cfg:/opt/steam/hlds/cstrike/reunion.cfg:ro
      - ./cstrike/config:/opt/steam/hlds/cstrike/config:ro
      - ./cstrike/config/server-biohazard.cfg:/opt/steam/hlds/cstrike/config/server.cfg:ro
      - ./cstrike/amxmodx/users.ini:/opt/steam/hlds/cstrike/addons/amxmodx/configs/users.ini:ro
      - ./image/zombiemod/plugins-biohazard.ini:/opt/steam/hlds/cstrike/addons/amxmodx/configs/plugins.ini:ro
    command: *cs16_biohazard_cmd

  fastdl:
    profiles:
      - fastdl
    build:
      context: .
      dockerfile: docker/fastdl/Dockerfile
      args:
        GAME_IMAGE: ${CS16_IMAGE_NAME:-cs16-respawn:latest}
    image: ${FASTDL_IMAGE_NAME:-cs16-fastdl:latest}
    container_name: cs16-fastdl0
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "${FASTDL_HTTP_PORT:-8080}:80/tcp"
    volumes:
      - ./data/cs16-game-assets:/mnt/cs16-game-assets:ro
