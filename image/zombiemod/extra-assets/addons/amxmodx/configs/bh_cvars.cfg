// Biohazard mod configuration file
echo Executing Biohazard mod configuration file

// Stock HL flashlight for survivors (ReGameDLL default is 0; gamemode.cfg runs before map load only).
mp_flashlight 1

// Sets sv_skyname. Note: Leave blank to disable.
bh_skyname "drkg"


// Shows your real health.
bh_showtruehealth 1


// Sets map light value ('a' darkest to 'z' brightest). Note: Leave blank to disable.
bh_lights "b"


// Enable weapons menu.
bh_weaponsmenu 1


// Randomly spawns everyone every new round. Note: Uses csdm spawn points.
bh_randomspawn 0


// Kill suiciders next time they spawn.
bh_punishsuicide 1


// How long till the infected player(s) shows up.
bh_starttime 15.0


//How long players will be able to buy (CS Buy Menu). Note: Use 0 to disable.
bh_buytime 0


// Maximum zombies
bh_maxzombies 31


// Round-end replacements for CT / Terrorist wins (bundled WAVs inspired by Zombie Plague lists).
bh_winsounds 1

// Brief spooky sting when the infection round begins (movement enabled after bh_starttime).
bh_roundstartsounds 1


// Ammo system for survivors/humans only (zombies are skipped in Biohazard).
// 0 - off (normal ammo)
// 1 - refill reserve ammo when depleted
// 2 - keep magazine topped up whenever CurWeapon fires + refill reserve when empty (effective infinite ammo in combat)
bh_ammo 1


// HEs explode on impact.
bh_impactexplode 1


// Flashbangs only blind zombies.
bh_flashbang 1


// Turn NVG on automatically when infected.
bh_autonvg 0

// 1 = green TE_DLIGHT bubble (Custom NVG Color style); 0 = stock full-screen NVGToggle.
bh_nvg_bubble 1

// Bubble color as RRRGGGBBB (default soft green).
bh_nvg_rgb 020255030

// Bubble radius in units (custom_nvg default 125).
bh_nvg_radius 100

// TE_DLIGHT decay rate (custom_nvg default 10).
bh_nvg_decay 10

// Light refresh life in seconds (custom_nvg default 1).
bh_nvg_life 0.5

// Cap health display to 255.
bh_caphealthdisplay 1


// Survivors cant be infected till their armor is gone.
bh_obeyarmor 0


// Money gain from infecting a survivor.
bh_infectionmoney 0


// Pain shock free system.
bh_painshockfree 1


// Objects pushed when shot.
bh_shootobjects 1


// Push multiplier for weapons.
bh_pushpwr_weapon 2.0


// Push multiplier for zombies.
bh_pushpwr_zombie 5.0


// Knockback system.
bh_knockback 1


// Disables knockback when zombie is ducking.
bh_knockback_duck 1


// Maximum distance of knockback to take effect.
bh_knockback_dist 280.0


// Enable zombie classes.
bh_zombie_class 1


// Randomize player class.
bh_randomclass 1


// Zombies are respawned as zombies.
bh_respawnaszombie 1


// Frag bonus when killing a zombie.
bh_kill_bonus 1


// Rewards for killing a zombie.
// 0 - off
// 1 - full clip
// 2 - he grenade
// 3 - both 
bh_kill_reward 2


// Starting zombie(s) multiplier. (player count * bh_zombie_multi)
bh_zombie_countmulti 0.15


// Starting zombie(s) health multiplier.
bh_zombie_hpmulti 2.0




// Sub-plugins cvars

// bio_radar.sma
//
// Enable/disable plugin.
bh_zombie_radar 1




//bio_smokeflare.sma
//
// Enable/disable plugin.
bh_flare_enable 1

// Flare life (seconds).
bh_flare_duration 999.9

// TE_DLIGHT radius (stock flashlight default is 11).
bh_flare_radius 14

// Smoke grenades given per loadout (biohazard equipweapon reads this cvar).
bh_flare_amount 2




// bio_antiblock.sma
//
// Enable/disable plugin.
bh_antiblock 1




// bio_boatescape.sma
//
// Chopper arrival delay.
bh_rescuetime 20.0




// customflashlight.sma
//
// Enable/disable customflashlight.amxx (0 = stock mp_flashlight only; plugin not loaded by default).
flashlight_custom 0


// Show flashlight to all players or only to the player who is using it.
flashlight_show_all 1


// Time in seconds it will take to flashlight to be fully drained.
flashlight_fulldrain_time 200


// Time in seconds it will take to flashlight to be fully charged.
flashlight_fullcharge_time 15


// Flashlight color.
// 0 - random (predifined) colors
// 1 - team colors
flashlight_color_type 1


// Flashlight color for CTs if flashlight_color_type is set to 1.
flashlight_color_ct 255255255


// Flashlight color for Ts if flashlight_color_type is set to 1.
flashlight_color_te 255255255


// Flashlight radius
flashlight_radius 11


// Max distance in units where you can see the flashlight.
flashlight_distance_max 4000.0


// Attenuation light factor according to distance between player and flashlight.
flashlight_attenuation 0


