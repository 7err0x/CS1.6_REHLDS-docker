// Biohazard mod configuration file
echo Executing Biohazard mod configuration file

// Browser "Game" column (FM_GetGameDescription). Default in plugin: Biohazard
bh_gamedescription "Biohazard"

// Crosshair name under sights (bio_crosshair_id.amxx). mp_playerid 2 disables ReGameDLL default ID UI.
bh_crosshair_id 1
bh_crosshair_id_dist 4096

// Stock HL flashlight for survivors (ReGameDLL default is 0; gamemode.cfg runs before map load only).
mp_flashlight 1

// Sets sv_skyname. Note: Leave blank to disable.
bh_skyname "drkg"


// Shows your real health.
bh_showtruehealth 1


// Sets map light value ('a' darkest to 'z' brightest). Note: Leave blank to disable.
bh_lights "b"


// Enable weapons menu.
bh_weaponsmenu 1


// Randomly spawns everyone every new round. Note: Uses csdm spawn points.
bh_randomspawn 1


// Kill suiciders next time they spawn.
bh_punishsuicide 1


// How long till the infected player(s) shows up.
bh_starttime 15.0


//How long players will be able to buy (CS Buy Menu). Note: Use 0 to disable.
bh_buytime 0


// Maximum zombies
bh_maxzombies 31


// Round-end: CT win -> survivor_win* + bh_ctwin_rise*; T win -> zombie_win* + bh_terwin_dark* (Valve the_horror).
bh_winsounds 1

// Infection round live: random CSO "zombie is coming" sting (bh_round_sting*).
bh_roundstartsounds 1

// ZP-style looping ambience (zombie_plague/ambience.wav). Off by default — use bh_ambience one-shots instead.
zp_ambience_sounds 0

// ZP zombie idle/pain/die/knife sounds (Nihilanth + zombie_plague pack).
zp_zombie_sounds_pain 1
zp_zombie_sounds_attack 1
// Idle taunts removed from zp50_zombie_sounds — use bh_ambience instead.
// zp_zombie_sounds_idle (obsolete)

// Optional one-shot Nihilanth/zombie groans (bh_amb_*). Disabled when zp_ambience_sounds is on.
bh_ambience 1
bh_ambience_min 30.0
bh_ambience_max 60.0
bh_ambience_vol 0.90
// Max distance (units) for ambience: emitted from a zombie; survivors hear only when this close to any zombie.
bh_ambience_hear_dist 900.0


// Ammo system for survivors/humans only (zombies are skipped in Biohazard).
// 0 - off (normal ammo)
// 1 - refill reserve ammo when depleted
// 2 - keep magazine topped up whenever CurWeapon fires + refill reserve when empty (effective infinite ammo in combat)
bh_ammo 1


// HEs explode on impact.
bh_impactexplode 1


// Flashbangs only blind zombies.
bh_flashbang 1


// Turn NVG on automatically when infected.
bh_autonvg 0

// 1 = green TE_DLIGHT bubble (Custom NVG Color style); 0 = stock full-screen NVGToggle.
bh_nvg_bubble 1

// Bubble color as RRRGGGBBB (default soft green).
bh_nvg_rgb 020255030

// Bubble radius in units (custom_nvg default 125).
bh_nvg_radius 100

// TE_DLIGHT decay rate (custom_nvg default 10).
bh_nvg_decay 10

// Light refresh life in seconds (custom_nvg default 1).
bh_nvg_life 0.5

// 1 = local TE_DLIGHT for all players while dead (natural light; not green NVGToggle).
bh_nvg_spectator 1

// Spectator light color RRRGGGBBB (default warm white; zombies use bh_nvg_rgb).
bh_nvg_spec_rgb 255255235

// Cap health display to 255.
bh_caphealthdisplay 1


// Survivors cant be infected till their armor is gone.
bh_obeyarmor 0


// Money gain from infecting a survivor.
bh_infectionmoney 0


// Pain shock free system.
bh_painshockfree 1


// Objects pushed when shot.
bh_shootobjects 1


// Push multiplier for weapons.
bh_pushpwr_weapon 2.0


// Push multiplier for zombies.
bh_pushpwr_zombie 5.0


// Knockback system.
bh_knockback 1


// Disables knockback when zombie is ducking.
bh_knockback_duck 1


// Maximum distance of knockback to take effect.
bh_knockback_dist 280.0


// Global knockback strength multiplier (1.0 = default; 2.0 = double push).
bh_knockback_multi 6.0


// Enable zombie classes.
bh_zombie_class 1

// Server speed ceiling for zombies (ReGameDLL default sv_maxspeed is 320). 0 = auto from bh_zombieclass.ini.
bh_sv_maxspeed 0


// Randomize player class.
bh_randomclass 1


// Dead players respawn as zombies after bh_dead_zombie_respawn_delay (real humans only; E-BOTs excluded).
// bh_dead_zombie_respawn 0 = dead survivors stay dead; dead zombies still respawn as zombies.
bh_dead_zombie_respawn 1
bh_dead_zombie_respawn_delay 60.0


// Frag bonus when killing a zombie.
bh_kill_bonus 1


// Rewards for killing a zombie.
// 0 - off
// 1 - full clip
// 2 - he grenade
// 3 - both 
bh_kill_reward 2


// Starting zombie(s) multiplier. (player count * bh_zombie_multi)
bh_zombie_countmulti 0.15


// Starting zombie(s) health multiplier.
bh_zombie_hpmulti 2.0




// Sub-plugins cvars

// bio_radar.sma
//
// Enable/disable plugin.
bh_zombie_radar 1




//bio_smokeflare.sma
//
// Enable/disable plugin.
bh_flare_enable 1

// Flare life (seconds).
bh_flare_duration 999.9

// TE_DLIGHT radius (stock flashlight default is 11).
bh_flare_radius 30

// Smoke grenades given per loadout (biohazard equipweapon reads this cvar).
bh_flare_amount 2




// bio_antiblock.sma — hold +use (E) to pass through teammates; blocked on enemy lasermines.
bh_antiblock 1
bh_antiblock_laser_guard 1




// bio_boatescape.sma
//
// Chopper arrival delay.
bh_rescuetime 20.0




// customflashlight.sma
//
// Enable/disable customflashlight.amxx (0 = stock mp_flashlight only; plugin not loaded by default).
flashlight_custom 0


// Show flashlight to all players or only to the player who is using it.
flashlight_show_all 1


// Time in seconds it will take to flashlight to be fully drained.
flashlight_fulldrain_time 200


// Time in seconds it will take to flashlight to be fully charged.
flashlight_fullcharge_time 15


// Flashlight color.
// 0 - random (predifined) colors
// 1 - team colors
flashlight_color_type 1


// Flashlight color for CTs if flashlight_color_type is set to 1.
flashlight_color_ct 255255255


// Flashlight color for Ts if flashlight_color_type is set to 1.
flashlight_color_te 255255255


// Flashlight radius
flashlight_radius 11


// Max distance in units where you can see the flashlight.
flashlight_distance_max 4000.0


// Attenuation light factor according to distance between player and flashlight.
flashlight_attenuation 0


// --- LaserTripmine (AoiKagase) — tuned in addons/amxmodx/configs/plugins/lasermine/bh_ltm_cvars.cfg
// Defaults here: 2 mines at round start, up to 6 carried (buy more in buy zone).


// --- Smoker class (4eRT ZP drag port — bio_smoker.amxx)
bh_smoker_enable 1
bh_smoker_range 600
bh_smoker_speed 160
bh_smoker_cooldown 5.0
bh_smoker_maxtime 15.0
bh_smoker_breakdmg 300
bh_smoker_use_key 1
bh_smoker_hint 1
bh_smoker_freeze_victim 1
// E-BOT / YaPB: auto tongue nearest survivor in range (no client bind).
bh_smoker_bot_enable 1
// 0 = AI may hook through walls (pairs with ebot_zombie_wall_hack); 1 = require LOS trace.
bh_smoker_bot_los 1


// --- Chat profanity filter (bio_chatfilter.amxx) — word list: configs/bh_chatfilter_words.ini
bh_chatfilter_enable 1
bh_chatfilter_ban 1
bh_chatfilter_ban_minutes 1
bh_chatfilter_mute 1
bh_chatfilter_admin_exempt 1
bh_chatfilter_ban_reason "Banned: inappropriate language"


// --- E-BOT schedule (bio_ebot_schedule.amxx) — edit bh_ebot_schedule.cfg, not here.
// biohazard exec's this file before bio_ebot_schedule registers its cvars on first load.


