; Biohazard class configuration file
; Default File location: cstrike/addons/amxmodx/configs/bh_zombieclass.ini
; To use with Biohazard plugin

; Each [section] is one zombie class. Omitted keys use defaults from biohazard.cfg
; (see biohazard.sma / DEFAULT_*). Classname is shown in the zombie class menu.
;
; [class]     - Section header / internal classname (e.g. [Slum]).
; DESC        - Short label shown in /class menu as "classname - DESC".
; PMODEL      - Third-person player model path (no spaces). Applied on infect.
; WMODEL      - First-person knife viewmodel while infected (no spaces).
;
; HEALTH      - HP on infect and regen cap (default 170). First-round zombies may
;               also be scaled by server cvar bh_zombie_hpmulti. Regen only runs while
;               current HP is below this value (+1 HP per tick, see REGENDLY).
; SPEED       - Max run speed while infected (default 280; CS human baseline ~250).
; GRAVITY     - pev_gravity multiplier (default 1.0). Lower = higher jumps / floatier
;               (e.g. 0.1 for Leaper). Values above 1.0 feel heavier.
;
; ATTACK      - Knife damage multiplier vs humans (default 2.0). Only zombie knife hits;
;               stacks with base knife damage before armor/infection logic.
; DEFENCE     - Bullet damage taken multiplier (default 0.087 ≈ 8.7% of gun damage).
;               Lower = tankier vs rifles/SMGs. Does not affect zombie-vs-zombie.
; HEDEFENCE   - HE / grenade explosion damage taken multiplier (default 1.0). Lower
;               = more resistant to HE (e.g. Gonome 0.30). Flash/smoke not HE.
;
; HITSPEED    - Pain slowdown strength (default 0.89). After taking damage, while
;               HITDELAY is active, horizontal velocity is multiplied by this value
;               (only on ground, not ducking, and only if bh_painshockfree is 1).
;               1.0 = no slow; lower = stronger slow (0.5 = half speed).
; HITDELAY    - Seconds after taking damage that HITSPEED applies (default 0.28).
;               Also refreshed on every hit.
;
; REGENDLY    - Seconds between +1 HP while below HEALTH and not in regen pause
;               (default 0.18). Smaller = faster passive regen.
; HITREGENDLY - Regen pause after taking damage, in seconds (default 2.0). While
;               gametime < last_hit + HITREGENDLY, regen does not tick. Refreshed
;               on every hit.
;
; KNOCKBACK   - Bullet knockback multiplier when humans shoot this zombie (default
;               1.0). Only if bh_knockback is 1, damage is DMG_BULLET, shooter is
;               within bh_knockback_dist, and victim is not ducked on ground (when
;               bh_knockback_duck is 1). Lower = harder to pin with gunfire (Hulk 0.40);
;               higher = easier to push (Smoker 1.1). Weapon type still matters.


[Slum]
