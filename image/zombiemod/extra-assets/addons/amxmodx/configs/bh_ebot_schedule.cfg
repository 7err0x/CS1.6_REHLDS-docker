// E-BOT dynamic quota (bio_ebot_schedule.amxx).
// Loaded after the plugin registers cvars — do not put these in bh_cvars.cfg
// (biohazard exec's bh_cvars.cfg before this plugin exists on first load).

// Master switch (0 = do not change ebot_quota; use ebot-biohazard.cfg only).
bh_ebot_sched_enable 1

// require_human 1: no bots until someone joins (bh_ebot_quota_empty).
// require_human 0: bots may fill per schedule even when empty; pause AI to save CPU.
bh_ebot_require_human 1
bh_ebot_pause_without_humans 1
bh_ebot_quota_empty 0

// Humans online, hour schedule disabled (bh_ebot_sched_use_hours 0).
bh_ebot_quota_with_humans 2

// Peak window uses local server time (0–23). Overnight if peak_start > peak_end
// (example: 22→10 = 10 PM through 9:59 AM).
bh_ebot_sched_use_hours 0
bh_ebot_sched_peak_start 16
bh_ebot_sched_peak_end 3
bh_ebot_sched_quota_peak 5
bh_ebot_sched_quota_offpeak 0

// Re-check interval (seconds) for hour changes and connect/disconnect debounce.
bh_ebot_sched_check_secs 1800

// Log quota changes to AMXX log (0/1).
bh_ebot_sched_debug 0
